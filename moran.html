let currentType="";


/* 🎯 בחירת סוג */
function setType(type){
currentType=type;
render();
}


/* 📏 מרחק */
function distance(a,b,c,d){
let R=6371;
let dLat=(c-a)*Math.PI/180;
let dLon=(d-b)*Math.PI/180;


let x=
Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*
Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;


return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}


/* 🔥 רינדור */
function render(){


let list=[];


/* קטגוריה */
if(!currentType){
for(let k in allData){
list.push(...allData[k]);
}
}else{
list=allData[currentType];
}


/* חיפוש */
let s=document.getElementById("search").value;
if(s){
list=list.filter(r=>r.name.includes(s));
}


/* 10 ק״מ */
list=list.filter(r=>distance(userLat,userLon,r.lat,r.lon)<=10);


/* מיון */
list.sort((a,b)=>
distance(userLat,userLon,a.lat,a.lon) -
distance(userLat,userLon,b.lat,b.lon)
);


document.getElementById("list").innerHTML="";


list.forEach(r=>{


let d=distance(userLat,userLon,r.lat,r.lon).toFixed(1);


let div=document.createElement("div");
div.className="card";


div.innerHTML=`
<img class="img" src="https://source.unsplash.com/800x400/?food">
<div class="content">


<div class="name">${r.name}</div>


<div class="row">
<div>⭐ ${r.rating}</div>
<div>📍 ${d} ק״מ</div>
</div>


<span class="badge">✡️ כשר</span>
<span class="badge">🟢 פתוח</span>


<div class="small">עד 10 ק״מ ממך</div>


<div class="btns">


<a target="_blank" href="https://waze.com/ul?ll=${r.lat},${r.lon}&navigate=yes">
<button class="waze">🚗 Waze</button>
</a>


<a target="_blank" href="https://www.google.com/search?q=${r.name}+כשרות">
<button class="google">🔎 בדיקה</button>
</a>


</div>


</div>
`;


document.getElementById("list").appendChild(div);


});


}


render();
